{{ define "main" }}
<div class="w-full md:w-3/4 lg:w-1/2 mx-auto px-4 py-12">
    <h1 class="text-3xl md:text-5xl font-bold mb-8 md:mb-12 text-text-primary-light dark:text-text-primary-dark">{{ .Title }}</h1>
    
    <div class="grid grid-cols-1 gap-6 md:gap-8 max-w-3xl mx-auto">
        {{ range .RegularPages }}
        <div class="project-card relative overflow-hidden rounded-lg bg-bg-primary-light dark:bg-bg-secondary-dark border border-border-primary-light dark:border-border-primary-dark transition-all duration-300 group">
            <div class="aspect-w-16 aspect-h-9 overflow-hidden relative bg-neutral-900">
                <img src="{{ .Params.image }}" alt="{{ .Title }}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110 z-10 relative opacity-80">
                
                <div class="absolute inset-0 bg-gradient-to-t from-black/95 via-black/70 to-black/20 z-20"></div>
                
                <div class="absolute inset-0 z-30 p-4 pb-3 md:p-6 md:pb-4 flex flex-col justify-end transform transition-transform duration-500 translate-y-0 group-hover:translate-y-[-20px]">
                    
                    <h3 class="text-xl md:text-2xl font-bold mb-2 md:mb-3 text-white drop-shadow-lg line-clamp-2">{{ .Title }}</h3>
                    
                    <div class="flex flex-wrap gap-2 mb-3 md:mb-4">
                        {{ range .Params.tags }}
                        <span class="px-2 py-1 bg-neutral-900/90 border border-neutral-600/50 shadow-md backdrop-blur-md rounded-md text-[10px] md:text-xs font-semibold text-neutral-50 tracking-wide">{{ . }}</span>
                        {{ end }}
                    </div>
                    
                    <p class="hidden md:block text-sm text-neutral-200 mb-4 line-clamp-3 md:line-clamp-4 drop-shadow-md">{{ .Description }}</p>
                    
                    <a href="{{ .Permalink }}" class="bg-white hover:bg-neutral-200 text-neutral-900 text-xs md:text-sm font-bold py-1.5 md:py-2 px-3 md:px-4 rounded-md inline-flex items-center transition-all duration-300 transform opacity-100 md:opacity-0 group-hover:opacity-100 w-fit shadow-xl">
                        Learn More
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-1.5 transform group-hover:translate-x-1 transition-transform duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                        </svg>
                    </a>
                </div>
            </div>
        </div>
        {{ end }}
    </div>
</div>

<style>
.project-card {
    height: 100%;
    display: flex;
    flex-direction: column;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    @apply bg-bg-primary-light dark:bg-bg-secondary-dark;
    backdrop-filter: blur(10px);
}

.project-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
    border-color: rgba(2, 132, 199, 0.5); 
}
html.dark .project-card:hover {
    border-color: rgba(14, 165, 233, 0.5); 
}

.aspect-w-16 {
    position: relative;
    padding-bottom: 56.25%;
}

.aspect-w-16 > img {
    position: absolute;
    height: 100%;
    width: 100%;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    object-fit: cover;
    filter: saturate(1.1) contrast(1.1);
}

@media (max-width: 768px) {
    .project-card:hover {
        transform: none;
    }
    
    .project-card .group-hover\:translate-y-\[-20px\] {
        transform: translateY(-10px);
    }
}
</style>
{{ end }}
